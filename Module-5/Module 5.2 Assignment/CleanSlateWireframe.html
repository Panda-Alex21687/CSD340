<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bioSite Wireframe</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      margin: 0;
    }

    header, footer {
      background: #ddd;
      padding: 15px;
      text-align: center;
    }

    nav ul {
      list-style: none;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    section {
      padding: 40px 20px;
      background: #fff;
      margin: 20px;
      border: 1px solid #ccc;
    }

    .hero {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
    }

    .hero-text, .hero-image {
      flex: 1;
      border: 1px dashed #999;
      padding: 20px;
      text-align: center;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      border: 1px dashed #999;
      padding: 20px;
      text-align: center;
    }

    .about-layout {
      display: flex;
      gap: 30px;
    }

    .about-image, .about-text {
      flex: 1;
      border: 1px dashed #999;
      padding: 20px;
      text-align: center;
    }

    .quote {
      margin-top: 20px;
      border: 1px dashed #999;
      padding: 10px;
    }

    footer {
      margin-top: 40px;
    }
  </style>
</head>
<body>

<header>
  <h1>Site Title</h1>
  <nav>
    <ul>
      <li>Home</li>
      <li>About</li>
      <li>Hobbies</li>
    </ul>
  </nav>
</header>

<!-- Landing Page Wireframe -->
<section>
  <h2>Landing Page</h2>

  <div class="hero">
    <div class="hero-text">Hero Text Area</div>
    <div class="hero-image">Hero Image Area</div>
  </div>

  <div class="card-grid">
    <div class="card">Card 1</div>
    <div class="card">Card 2</div>
    <div class="card">Card 3</div>
  </div>
</section>

<!-- About Page Wireframe -->
<section>
  <h2>About Page</h2>

  <div class="about-layout">
    <div class="about-image">Portrait Image Area</div>
    <div class="about-text">
      Bio Text Area
      <div class="quote">Quote Area</div>
    </div>
  </div>
</section>

<!-- Hobbies Page Wireframe -->
<section>
  <h2>Hobbies Page</h2>

  <div class="card-grid">
    <div class="card">Hobby Card 1</div>
    <div class="card">Hobby Card 2</div>
    <div class="card">Hobby Card 3</div>
  </div>
</section>

<footer>
  Footer Area
</footer>

</body>
</html>
